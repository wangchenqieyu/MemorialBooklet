services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: memorialbooklet:latest
    container_name: memorial_booklet_app
    restart: always
    depends_on:
      - mysql-docker
      - ipfs-node
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: ${APP_PORT:-8081}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-docker:3306/${MYSQL_DATABASE:-family_tree}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${MYSQL_APP_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_APP_PASSWORD:-123456}
      CONFLUX_RPC_URL: ${CONFLUX_RPC_URL:-https://evmtestnet.confluxrpc.com}
      CONFLUX_PRIVATE_KEY: ${CONFLUX_PRIVATE_KEY:-}
      CONFLUX_CONTRACT_ADDRESS: ${CONFLUX_CONTRACT_ADDRESS:-}
      IPFS_MULTI_ADDRESS: ${IPFS_MULTI_ADDRESS:-/dns4/ipfs-node/tcp/5001}
    ports:
      - "${APP_PORT:-8081}:8081"
    networks:
      - family-net

  mysql-docker:
    image: ${MYSQL_IMAGE:-docker.m.daocloud.io/library/mysql:8.0}
    container_name: family_tree_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-family_tree}
      MYSQL_TCP_PORT: 3306
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - ./docker-mysql/data:/var/lib/mysql
      - ./docker-mysql/init:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - family-net

  ipfs-node:
    image: ${IPFS_IMAGE:-ghcr.io/ipfs/kubo:v0.30.0}
    container_name: ipfs_node
    restart: always
    command: daemon --enable-pubsub-experiment
    ports:
      - "${IPFS_API_PORT:-5001}:5001"
      - "${IPFS_GATEWAY_PORT:-8080}:8080"
      - "${IPFS_SWARM_PORT:-4001}:4001"
    volumes:
      - ipfs_data:/data/ipfs
    networks:
      - family-net

volumes:
  ipfs_data:

networks:
  family-net:
    driver: bridge
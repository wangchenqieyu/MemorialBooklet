## 定义持久化卷
#volumes:
#  ipfs_data:
#  # Docker 会自动管理此卷，保证 IPFS 数据不丢失

services:
  mysql-docker:
    image: mysql:8.0
    container_name: family_tree_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: "family_tree"
      # 这里不需要指定 MYSQL_DATABASE，因为我们的 init-dump.sql 里包含了 create database 语句
      MYSQL_TCP_PORT: 3306

    ports:
      # 【重要】为了避免和你本地运行的 MySQL (3306) 冲突，
      # 我们把容器的 3306 映射到宿主机的 3307 端口
      - "3307:3306"
    volumes:
      # 1. 数据持久化：防止重启容器后数据丢失
      - ./docker-mysql/data:/var/lib/mysql
      # 2. 初始化脚本：将刚才导出的数据挂载进去，容器第一次启动时会自动导入
      - ./docker-mysql/init:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - family-net

networks:
  family-net:
    driver: bridge
name: Deploy to ECS Prod (Compose)

on:
  push:
    branches:
      - 'release/*'

concurrency:
  group: ecs-prod-deploy
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: [self-hosted, ecs_prod]
    environment: ecs_prod
    env:
      HTTP_PROXY: ${{ vars.HTTP_PROXY }}
      HTTPS_PROXY: ${{ vars.HTTPS_PROXY }}
      NO_PROXY: ${{ vars.NO_PROXY }}
      ENFORCE_MIRROR_GUARD: ${{ vars.ENFORCE_MIRROR_GUARD || 'false' }}

    steps:
      - name: Preflight GitHub connectivity (best effort)
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          for url in https://github.com https://api.github.com; do
            if curl -I --connect-timeout 10 --max-time 20 "$url" >/dev/null 2>&1; then
              echo "OK: $url"
            else
              echo "WARN: cannot reach $url right now"
            fi
          done

      - name: Pre-checkout network diagnostics (best effort)
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "=== pre-checkout diagnostics ==="
          date -u || true
          uname -a || true
          cat /etc/resolv.conf || true
          env | egrep -i 'http_proxy|https_proxy|no_proxy' || true

          echo "=== dns ==="
          for host in github.com api.github.com; do
            echo "host=${host}"
            getent ahosts "${host}" | head -n 5 || true
          done

          echo "=== https ==="
          curl -I --connect-timeout 8 --max-time 20 https://github.com || true
          curl -I --connect-timeout 8 --max-time 20 https://api.github.com || true

          echo "=== tls ==="
          echo | openssl s_client -connect github.com:443 -servername github.com -brief || true

          echo "=== git ==="
          git --no-pager ls-remote https://github.com/${GITHUB_REPOSITORY}.git || true

      - name: Checkout (attempt 1)
        id: checkout_primary
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          fetch-depth: 1

      - name: Wait before checkout retry
        if: steps.checkout_primary.outcome == 'failure'
        shell: bash
        run: sleep 20

      - name: Checkout (attempt 2)
        id: checkout_retry
        if: steps.checkout_primary.outcome == 'failure'
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          fetch-depth: 1

      - name: Post-checkout-failure diagnostics (best effort)
        if: steps.checkout_primary.outcome == 'failure' && steps.checkout_retry.outcome == 'failure'
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "=== post-checkout diagnostics ==="
          date -u || true
          cat /etc/resolv.conf || true

          for host in github.com api.github.com; do
            echo "host=${host}"
            getent ahosts "${host}" | head -n 5 || true
          done

          curl -I --connect-timeout 8 --max-time 20 https://github.com || true
          curl -I --connect-timeout 8 --max-time 20 https://api.github.com || true
          echo | openssl s_client -connect github.com:443 -servername github.com -brief || true
          git --no-pager ls-remote https://github.com/${GITHUB_REPOSITORY}.git || true

      - name: Fail if checkout could not be completed
        if: steps.checkout_primary.outcome == 'failure' && steps.checkout_retry.outcome == 'failure'
        shell: bash
        run: |
          echo "Both checkout attempts failed. See diagnostics above."
          exit 1

      - name: Ensure Docker is installed
        shell: bash
        run: |
          set -euo pipefail

          if command -v docker >/dev/null 2>&1; then
            echo "Docker already installed."
          else
            echo "Docker not found. Installing..."

            if command -v apt-get >/dev/null 2>&1; then
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y ca-certificates curl gnupg lsb-release

              # Prefer distro packages (usually faster and reachable from Aliyun mirrors).
              apt-get install -y docker.io docker-compose-v2 || \
              apt-get install -y docker.io docker-compose-plugin || \
              apt-get install -y docker.io docker-compose
            elif command -v dnf >/dev/null 2>&1; then
              dnf -y install dnf-plugins-core
              dnf config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
              dnf -y install docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
            elif command -v yum >/dev/null 2>&1; then
              yum -y install yum-utils
              yum-config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
              yum -y install docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
            else
              echo "Unsupported Linux distribution: cannot install Docker automatically."
              exit 1
            fi
          fi

          if command -v systemctl >/dev/null 2>&1; then
            systemctl enable docker
            systemctl start docker
          fi

      - name: Verify Docker
        shell: bash
        run: |
          set -euo pipefail
          docker version

          if docker compose version >/dev/null 2>&1; then
            docker compose version
          elif command -v docker-compose >/dev/null 2>&1; then
            docker-compose version
          else
            echo "Neither docker compose (v2) nor docker-compose (v1) is available."
            exit 1
          fi

      - name: Configure Docker registry mirror (optional)
        shell: bash
        env:
          DOCKER_REGISTRY_MIRROR: ${{ vars.DOCKER_REGISTRY_MIRROR }}
        run: |
          set -euo pipefail

          if [ -z "${DOCKER_REGISTRY_MIRROR:-}" ]; then
            echo "DOCKER_REGISTRY_MIRROR is not set. Skip mirror config."
            exit 0
          fi

          echo "Configuring docker registry mirror: ${DOCKER_REGISTRY_MIRROR}"
          mkdir -p /etc/docker
          cat > /etc/docker/daemon.json <<EOF
          {
            "registry-mirrors": ["${DOCKER_REGISTRY_MIRROR}"]
          }
          EOF

          if command -v systemctl >/dev/null 2>&1; then
            systemctl restart docker
          else
            service docker restart
          fi

          docker info | grep -i "Registry Mirrors" -A2 || true

      - name: Login to Alibaba Cloud ACR (optional)
        shell: bash
        env:
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME || vars.ACR_USERNAME || '' }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD || vars.ACR_PASSWORD || '' }}
        run: |
          set -euo pipefail

          if [ -z "${ACR_REGISTRY:-}" ]; then
            echo "ACR_REGISTRY is not set. Skip ACR login."
            exit 0
          fi

          if [ -z "${ACR_USERNAME:-}" ] || [ -z "${ACR_PASSWORD:-}" ]; then
            echo "WARN: ACR_REGISTRY is set, but ACR_USERNAME/ACR_PASSWORD is missing."
            echo "WARN: Continue without registry login (works only for public images)."
            exit 0
          fi

          echo "Logging in to ACR: ${ACR_REGISTRY}"
          echo "${ACR_PASSWORD}" | docker login "${ACR_REGISTRY}" --username "${ACR_USERNAME}" --password-stdin

      - name: Print deploy context (safe debug)
        shell: bash
        env:
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME || vars.ACR_USERNAME || '' }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD || vars.ACR_PASSWORD || '' }}
          MYSQL_IMAGE_MIRROR: ${{ vars.MYSQL_IMAGE_MIRROR || '' }}
          IPFS_IMAGE_MIRROR: ${{ vars.IPFS_IMAGE_MIRROR || '' }}
          IPFS_IMAGE_CANDIDATES: ${{ vars.IPFS_IMAGE_CANDIDATES || '' }}
        run: |
          set -euo pipefail
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"
          echo "runner=${RUNNER_NAME:-unknown} os=${RUNNER_OS:-unknown} arch=${RUNNER_ARCH:-unknown}"
          echo "environment=ecs_prod"
          echo "proxy.http_set=$([ -n "${HTTP_PROXY:-}" ] && echo yes || echo no)"
          echo "proxy.https_set=$([ -n "${HTTPS_PROXY:-}" ] && echo yes || echo no)"
          echo "proxy.no_proxy_set=$([ -n "${NO_PROXY:-}" ] && echo yes || echo no)"
          echo "acr.registry_set=$([ -n "${ACR_REGISTRY:-}" ] && echo yes || echo no)"
          echo "acr.username_set=$([ -n "${ACR_USERNAME:-}" ] && echo yes || echo no)"
          echo "acr.password_set=$([ -n "${ACR_PASSWORD:-}" ] && echo yes || echo no)"
          echo "mirror.mysql_set=$([ -n "${MYSQL_IMAGE_MIRROR:-}" ] && echo yes || echo no)"
          echo "mirror.ipfs_set=$([ -n "${IPFS_IMAGE_MIRROR:-}" ] && echo yes || echo no)"
          echo "mirror.ipfs_candidates_set=$([ -n "${IPFS_IMAGE_CANDIDATES:-}" ] && echo yes || echo no)"

      - name: Probe reachable IPFS image (best effort)
        shell: bash
        continue-on-error: true
        env:
          IPFS_IMAGE_MIRROR: ${{ vars.IPFS_IMAGE_MIRROR || '' }}
          IPFS_IMAGE_DEFAULT: ${{ vars.IPFS_IMAGE || 'ghcr.io/ipfs/kubo:v0.30.0' }}
          IPFS_IMAGE_CANDIDATES: ${{ vars.IPFS_IMAGE_CANDIDATES || 'ghcr.io/ipfs/kubo:v0.30.0,ghcr.io/ipfs/kubo:latest,quay.io/ipfs/kubo:latest' }}
        run: |
          set -euo pipefail

          normalize() {
            echo "$1" | xargs
          }

          ordered=""
          if [ -n "${IPFS_IMAGE_MIRROR:-}" ]; then
            ordered="$(normalize "${IPFS_IMAGE_MIRROR}")"
          fi

          IFS=',' read -r -a raw_candidates <<< "${IPFS_IMAGE_CANDIDATES}"
          for item in "${raw_candidates[@]}"; do
            c="$(normalize "${item}")"
            [ -z "${c}" ] && continue
            if [ -z "${ordered}" ]; then
              ordered="${c}"
            elif ! echo "${ordered}" | tr ',' '\n' | grep -Fxq "${c}"; then
              ordered="${ordered},${c}"
            fi
          done

          d="$(normalize "${IPFS_IMAGE_DEFAULT}")"
          if [ -n "${d}" ] && ! echo "${ordered}" | tr ',' '\n' | grep -Fxq "${d}"; then
            ordered="${ordered},${d}"
          fi

          echo "IPFS candidate order: ${ordered}"

          selected=""
          IFS=',' read -r -a final_candidates <<< "${ordered}"
          for img in "${final_candidates[@]}"; do
            img="$(normalize "${img}")"
            [ -z "${img}" ] && continue
            echo "Probe IPFS image: ${img}"
            if timeout 20 docker manifest inspect "${img}" >/dev/null 2>&1; then
              selected="${img}"
              echo "Probe OK: ${img}"
              break
            fi
            echo "Probe FAIL: ${img}"
          done

          if [ -n "${selected}" ]; then
            echo "IPFS_IMAGE_PROBED=${selected}" >> "$GITHUB_ENV"
            echo "Selected IPFS image by probe: ${selected}"
          else
            echo "::warning::No reachable IPFS image found from candidates; fallback will be used."
          fi

      - name: Resolve image source (prefer ACR mirror)
        shell: bash
        env:
          MYSQL_IMAGE_DEFAULT: ${{ vars.MYSQL_IMAGE || 'docker.m.daocloud.io/library/mysql:8.0' }}
          IPFS_IMAGE_DEFAULT: ${{ vars.IPFS_IMAGE || 'ghcr.io/ipfs/kubo:v0.30.0' }}
          MYSQL_IMAGE_MIRROR: ${{ vars.MYSQL_IMAGE_MIRROR || '' }}
          IPFS_IMAGE_MIRROR: ${{ vars.IPFS_IMAGE_MIRROR || '' }}
        run: |
          set -euo pipefail

          # Always prefer mirror values when configured; otherwise fall back to defaults.
          MYSQL_IMAGE_EFFECTIVE="${MYSQL_IMAGE_MIRROR:-${MYSQL_IMAGE_DEFAULT}}"

          if [ -n "${IPFS_IMAGE_PROBED:-}" ]; then
            IPFS_IMAGE_EFFECTIVE="${IPFS_IMAGE_PROBED}"
            IPFS_IMAGE_SOURCE="probe"
          elif [ -n "${IPFS_IMAGE_MIRROR:-}" ]; then
            # Mirror is configured: verify it first, otherwise auto-fallback to default.
            if timeout 20 docker manifest inspect "${IPFS_IMAGE_MIRROR}" >/dev/null 2>&1; then
              IPFS_IMAGE_EFFECTIVE="${IPFS_IMAGE_MIRROR}"
              IPFS_IMAGE_SOURCE="mirror"
            else
              echo "WARN: IPFS_IMAGE_MIRROR is not reachable: ${IPFS_IMAGE_MIRROR}"
              echo "WARN: Falling back to default IPFS image: ${IPFS_IMAGE_DEFAULT}"
              IPFS_IMAGE_EFFECTIVE="${IPFS_IMAGE_DEFAULT}"
              IPFS_IMAGE_SOURCE="default_fallback"
            fi
          else
            IPFS_IMAGE_EFFECTIVE="${IPFS_IMAGE_DEFAULT}"
            IPFS_IMAGE_SOURCE="default"
          fi

          MYSQL_IMAGE_SOURCE="default"
          if [ -n "${MYSQL_IMAGE_MIRROR:-}" ]; then MYSQL_IMAGE_SOURCE="mirror"; fi

          echo "MYSQL_IMAGE_EFFECTIVE=${MYSQL_IMAGE_EFFECTIVE}" >> "$GITHUB_ENV"
          echo "IPFS_IMAGE_EFFECTIVE=${IPFS_IMAGE_EFFECTIVE}" >> "$GITHUB_ENV"
          echo "MYSQL_IMAGE_SOURCE=${MYSQL_IMAGE_SOURCE}" >> "$GITHUB_ENV"
          echo "IPFS_IMAGE_SOURCE=${IPFS_IMAGE_SOURCE}" >> "$GITHUB_ENV"

          echo "Resolved MYSQL_IMAGE source=${MYSQL_IMAGE_SOURCE} value=${MYSQL_IMAGE_EFFECTIVE}"
          echo "Resolved IPFS_IMAGE source=${IPFS_IMAGE_SOURCE} value=${IPFS_IMAGE_EFFECTIVE}"

      - name: Preflight resolved image reachability
        shell: bash
        run: |
          set -euo pipefail

          echo "Preflight manifest: ${MYSQL_IMAGE_EFFECTIVE}"
          timeout 25 docker manifest inspect "${MYSQL_IMAGE_EFFECTIVE}" >/dev/null

          echo "Preflight manifest: ${IPFS_IMAGE_EFFECTIVE}"
          timeout 25 docker manifest inspect "${IPFS_IMAGE_EFFECTIVE}" >/dev/null

      - name: Guard mirror images for prod
        if: env.ENFORCE_MIRROR_GUARD == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "Guard mode is enabled (ENFORCE_MIRROR_GUARD=true)."
          echo "Guard check: MYSQL_IMAGE_EFFECTIVE=${MYSQL_IMAGE_EFFECTIVE:-<empty>}"
          echo "Guard check: IPFS_IMAGE_EFFECTIVE=${IPFS_IMAGE_EFFECTIVE:-<empty>}"
          echo "Guard check: MYSQL_IMAGE_SOURCE=${MYSQL_IMAGE_SOURCE:-unknown}"
          echo "Guard check: IPFS_IMAGE_SOURCE=${IPFS_IMAGE_SOURCE:-unknown}"

          if [ -z "${MYSQL_IMAGE_EFFECTIVE:-}" ] || [ -z "${IPFS_IMAGE_EFFECTIVE:-}" ]; then
            echo "Resolved images are empty."
            exit 1
          fi

          if [[ "${MYSQL_IMAGE_EFFECTIVE}" == "mysql:8.0" ]] || [[ "${IPFS_IMAGE_EFFECTIVE}" == "ipfs/kubo:latest" ]]; then
            echo "Still using Docker Hub defaults with guard enabled."
            echo "Set MYSQL_IMAGE_MIRROR and IPFS_IMAGE_MIRROR, or disable guard for non-prod."
            exit 1
          fi

          echo "Guard check passed: non-default images are configured."

      - name: Write .env for compose
        shell: bash
        run: |
          set -euo pipefail
          cat > .env <<EOF
          APP_PORT=${{ vars.APP_PORT || '8081' }}
          MYSQL_HOST_PORT=${{ vars.MYSQL_HOST_PORT || '3307' }}
          MYSQL_DATABASE=${{ vars.MYSQL_DATABASE || 'family_tree' }}
          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD || vars.MYSQL_ROOT_PASSWORD || '123456' }}
          MYSQL_APP_USER=${{ vars.MYSQL_APP_USER || 'root' }}
          MYSQL_APP_PASSWORD=${{ secrets.MYSQL_APP_PASSWORD || vars.MYSQL_APP_PASSWORD || '123456' }}
          MYSQL_IMAGE=${MYSQL_IMAGE_EFFECTIVE}
          IPFS_IMAGE=${IPFS_IMAGE_EFFECTIVE}
          CONFLUX_RPC_URL=${{ vars.CONFLUX_RPC_URL || 'https://evmtestnet.confluxrpc.com' }}
          CONFLUX_PRIVATE_KEY=${{ secrets.CONFLUX_PRIVATE_KEY || vars.CONFLUX_PRIVATE_KEY || '' }}
          CONFLUX_CONTRACT_ADDRESS=${{ secrets.CONFLUX_CONTRACT_ADDRESS || vars.CONFLUX_CONTRACT_ADDRESS || '' }}
          IPFS_MULTI_ADDRESS=${{ vars.IPFS_MULTI_ADDRESS || '/dns4/ipfs-node/tcp/5001' }}
          IPFS_API_PORT=${{ vars.IPFS_API_PORT || '5001' }}
          IPFS_GATEWAY_PORT=${{ vars.IPFS_GATEWAY_PORT || '8080' }}
          IPFS_SWARM_PORT=${{ vars.IPFS_SWARM_PORT || '4001' }}
          SPRING_PROFILES_ACTIVE=${{ vars.SPRING_PROFILES_ACTIVE || 'dev' }}
          EOF

      - name: Deploy with docker compose
        shell: bash
        run: |
          set -euo pipefail

          if docker compose version >/dev/null 2>&1; then
            COMPOSE_CMD="docker compose"
          else
            COMPOSE_CMD="docker-compose"
          fi

          echo "compose.cmd=${COMPOSE_CMD}"

          # Print resolved image names from compose config for debugging.
          COMPOSE_IMAGES="$($COMPOSE_CMD --env-file .env config | awk '/image:/ {print $2}')"
          if [ -n "${COMPOSE_IMAGES}" ]; then
            echo "compose.images:"
            echo "${COMPOSE_IMAGES}" | sed 's/^/  - /'
          else
            echo "WARN: no image found from compose config"
          fi

          diagnose_pull_failure() {
            echo "---- pull diagnostics ----"
            echo "time=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "proxy.http_set=$([ -n "${HTTP_PROXY:-}" ] && echo yes || echo no)"
            echo "proxy.https_set=$([ -n "${HTTPS_PROXY:-}" ] && echo yes || echo no)"
            echo "proxy.no_proxy_set=$([ -n "${NO_PROXY:-}" ] && echo yes || echo no)"
            echo "resolv.conf:"
            cat /etc/resolv.conf || true

            if command -v getent >/dev/null 2>&1; then
              for host in registry-1.docker.io auth.docker.io production.cloudflare.docker.com github.com; do
                echo "dns.getent ${host}:"
                getent ahosts "${host}" | head -n 3 || true
              done
            fi

            if command -v curl >/dev/null 2>&1; then
              for url in https://registry-1.docker.io/v2/ https://auth.docker.io/token https://github.com; do
                echo "http.check ${url}"
                curl -I --connect-timeout 8 --max-time 20 "${url}" | head -n 5 || true
              done
            fi

            if [ -n "${COMPOSE_IMAGES}" ]; then
              echo "image.manifest.precheck:"
              while IFS= read -r img; do
                [ -z "${img}" ] && continue
                if [ "${img}" = "memorialbooklet:latest" ]; then
                  echo "  SKIP ${img} (local build image)"
                  continue
                fi
                if docker manifest inspect "${img}" >/dev/null 2>&1; then
                  echo "  OK ${img}"
                else
                  echo "  FAIL ${img}"
                fi
              done <<< "${COMPOSE_IMAGES}"
            fi
            echo "---- end diagnostics ----"
          }

          for i in 1 2 3; do
            if $COMPOSE_CMD --env-file .env pull --ignore-buildable; then
              break
            fi

            echo "Image pull failed on attempt ${i}/3"
            diagnose_pull_failure

            if [ "$i" -eq 3 ]; then
              echo "Image pull failed after 3 attempts."
              exit 1
            fi

            echo "Image pull failed, retrying in 10s... (attempt $((i + 1))/3)"
            sleep 10
          done

          $COMPOSE_CMD --env-file .env up -d --build
          $COMPOSE_CMD --env-file .env ps

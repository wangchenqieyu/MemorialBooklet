name: Deploy to ECS Prod (Compose)

on:
  push:
    branches:
      - 'release/*'

concurrency:
  group: ecs-prod-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, ecs_prod]
    env:
      HTTP_PROXY: ${{ vars.HTTP_PROXY }}
      HTTPS_PROXY: ${{ vars.HTTPS_PROXY }}
      NO_PROXY: ${{ vars.NO_PROXY }}

    steps:
      - name: Preflight GitHub connectivity (best effort)
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          for url in https://github.com https://api.github.com; do
            if curl -I --connect-timeout 10 --max-time 20 "$url" >/dev/null 2>&1; then
              echo "OK: $url"
            else
              echo "WARN: cannot reach $url right now"
            fi
          done

      - name: Checkout (attempt 1)
        id: checkout_primary
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          fetch-depth: 1

      - name: Wait before checkout retry
        if: steps.checkout_primary.outcome == 'failure'
        shell: bash
        run: sleep 20

      - name: Checkout (attempt 2)
        if: steps.checkout_primary.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ensure Docker is installed
        shell: bash
        run: |
          set -euo pipefail

          if command -v docker >/dev/null 2>&1; then
            echo "Docker already installed."
          else
            echo "Docker not found. Installing..."

            if command -v apt-get >/dev/null 2>&1; then
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y ca-certificates curl gnupg lsb-release

              # Prefer distro packages (usually faster and reachable from Aliyun mirrors).
              apt-get install -y docker.io docker-compose-v2 || \
              apt-get install -y docker.io docker-compose-plugin || \
              apt-get install -y docker.io docker-compose
            elif command -v dnf >/dev/null 2>&1; then
              dnf -y install dnf-plugins-core
              dnf config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
              dnf -y install docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
            elif command -v yum >/dev/null 2>&1; then
              yum -y install yum-utils
              yum-config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
              yum -y install docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
            else
              echo "Unsupported Linux distribution: cannot install Docker automatically."
              exit 1
            fi
          fi

          if command -v systemctl >/dev/null 2>&1; then
            systemctl enable docker
            systemctl start docker
          fi

      - name: Verify Docker
        shell: bash
        run: |
          set -euo pipefail
          docker version

          if docker compose version >/dev/null 2>&1; then
            docker compose version
          elif command -v docker-compose >/dev/null 2>&1; then
            docker-compose version
          else
            echo "Neither docker compose (v2) nor docker-compose (v1) is available."
            exit 1
          fi

      - name: Configure Docker registry mirror (optional)
        shell: bash
        env:
          DOCKER_REGISTRY_MIRROR: ${{ vars.DOCKER_REGISTRY_MIRROR }}
        run: |
          set -euo pipefail

          if [ -z "${DOCKER_REGISTRY_MIRROR:-}" ]; then
            echo "DOCKER_REGISTRY_MIRROR is not set. Skip mirror config."
            exit 0
          fi

          echo "Configuring docker registry mirror: ${DOCKER_REGISTRY_MIRROR}"
          mkdir -p /etc/docker
          cat > /etc/docker/daemon.json <<EOF
          {
            "registry-mirrors": ["${DOCKER_REGISTRY_MIRROR}"]
          }
          EOF

          if command -v systemctl >/dev/null 2>&1; then
            systemctl restart docker
          else
            service docker restart
          fi

          docker info | grep -i "Registry Mirrors" -A2 || true

      - name: Login to Alibaba Cloud ACR (optional)
        shell: bash
        env:
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${ACR_REGISTRY:-}" ]; then
            echo "ACR_REGISTRY is not set. Skip ACR login."
            exit 0
          fi

          if [ -z "${ACR_USERNAME:-}" ] || [ -z "${ACR_PASSWORD:-}" ]; then
            echo "ACR_REGISTRY is set, but ACR_USERNAME/ACR_PASSWORD is missing."
            exit 1
          fi

          echo "Logging in to ACR: ${ACR_REGISTRY}"
          echo "${ACR_PASSWORD}" | docker login "${ACR_REGISTRY}" --username "${ACR_USERNAME}" --password-stdin

      - name: Write .env for compose
        shell: bash
        run: |
          cat > .env <<'EOF'
          APP_PORT=${{ vars.APP_PORT || '8081' }}
          MYSQL_HOST_PORT=${{ vars.MYSQL_HOST_PORT || '3307' }}
          MYSQL_DATABASE=${{ vars.MYSQL_DATABASE || 'family_tree' }}
          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_APP_USER=${{ vars.MYSQL_APP_USER || 'root' }}
          MYSQL_APP_PASSWORD=${{ secrets.MYSQL_APP_PASSWORD }}
          MYSQL_IMAGE=${{ vars.MYSQL_IMAGE || 'mysql:8.0' }}
          IPFS_IMAGE=${{ vars.IPFS_IMAGE || 'ipfs/kubo:latest' }}
          CONFLUX_RPC_URL=${{ vars.CONFLUX_RPC_URL || 'https://evmtestnet.confluxrpc.com' }}
          CONFLUX_PRIVATE_KEY=${{ secrets.CONFLUX_PRIVATE_KEY }}
          CONFLUX_CONTRACT_ADDRESS=${{ secrets.CONFLUX_CONTRACT_ADDRESS }}
          IPFS_MULTI_ADDRESS=${{ vars.IPFS_MULTI_ADDRESS || '/dns4/ipfs-node/tcp/5001' }}
          IPFS_API_PORT=${{ vars.IPFS_API_PORT || '5001' }}
          IPFS_GATEWAY_PORT=${{ vars.IPFS_GATEWAY_PORT || '8080' }}
          IPFS_SWARM_PORT=${{ vars.IPFS_SWARM_PORT || '4001' }}
          SPRING_PROFILES_ACTIVE=prod
          EOF

      - name: Deploy with docker compose
        shell: bash
        run: |
          set -euo pipefail

          if docker compose version >/dev/null 2>&1; then
            COMPOSE_CMD="docker compose"
          else
            COMPOSE_CMD="docker-compose"
          fi

          for i in 1 2 3; do
            if $COMPOSE_CMD pull --ignore-buildable; then
              break
            fi

            if [ "$i" -eq 3 ]; then
              echo "Image pull failed after 3 attempts."
              exit 1
            fi

            echo "Image pull failed, retrying in 10s... (attempt $((i + 1))/3)"
            sleep 10
          done

          $COMPOSE_CMD up -d --build
          $COMPOSE_CMD ps

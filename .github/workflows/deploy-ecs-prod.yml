name: Deploy to ECS Prod (Compose)

on:
  push:
    branches:
      - 'release/*'

concurrency:
  group: ecs-prod-deploy
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  packages: write # Required to push docker image cache

jobs:
  deploy:
    runs-on: [self-hosted, ecs_prod]
    environment: ecs_prod
    env:
      HTTP_PROXY: ${{ vars.HTTP_PROXY }}
      HTTPS_PROXY: ${{ vars.HTTPS_PROXY }}
      NO_PROXY: ${{ vars.NO_PROXY }}
      ENFORCE_MIRROR_GUARD: ${{ vars.ENFORCE_MIRROR_GUARD || 'false' }}
      # Define the base repository for the application image, using ACR variable.
      APP_IMAGE_REPO: ${{ vars.ACR_REGISTRY }}/memorialbooklet/app

    steps:
      - name: Preflight GitHub connectivity (best effort)
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          for url in https://github.com https://api.github.com; do
            if curl -I --connect-timeout 10 --max-time 20 "$url" >/dev/null 2>&1; then
              echo "OK: $url"
            else
              echo "WARN: cannot reach $url right now"
            fi
          done

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ensure Docker is installed
        shell: bash
        run: |
          set -euo pipefail
          if command -v docker >/dev/null 2>&1; then
            echo "Docker already installed."
          else
            echo "Docker not found. Installing..."
            # (Installation logic remains the same)
            if command -v apt-get >/dev/null 2>&1; then
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y ca-certificates curl gnupg lsb-release
              apt-get install -y docker.io docker-compose-v2 || apt-get install -y docker.io docker-compose-plugin || apt-get install -y docker.io docker-compose
            elif command -v dnf >/dev/null 2>&1; then
              dnf -y install dnf-plugins-core
              dnf config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
              dnf -y install docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
            elif command -v yum >/dev/null 2>&1; then
              yum -y install yum-utils
              yum-config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
              yum -y install docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
            else
              echo "Unsupported Linux distribution: cannot install Docker automatically."
              exit 1
            fi
          fi
          if command -v systemctl >/dev/null 2>&1; then
            systemctl enable docker && systemctl start docker
          fi

      - name: Verify Docker
        shell: bash
        run: |
          set -euo pipefail
          docker version
          if docker compose version >/dev/null 2>&1; then
            docker compose version
          elif command -v docker-compose >/dev/null 2>&1; then
            docker-compose version
          else
            echo "Neither docker compose (v2) nor docker-compose (v1) is available."
            exit 1
          fi

      - name: Configure Docker registry mirror (optional)
        shell: bash
        env:
          DOCKER_REGISTRY_MIRROR: ${{ vars.DOCKER_REGISTRY_MIRROR }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKER_REGISTRY_MIRROR:-}" ]; then
            echo "DOCKER_REGISTRY_MIRROR is not set. Skip mirror config."
            exit 0
          fi
          echo "Configuring docker registry mirror: ${DOCKER_REGISTRY_MIRROR}"
          mkdir -p /etc/docker
          cat > /etc/docker/daemon.json <<EOF
          {
            "registry-mirrors": ["${DOCKER_REGISTRY_MIRROR}"]
          }
          EOF
          if command -v systemctl >/dev/null 2>&1; then
            systemctl restart docker
          else
            service docker restart
          fi
          docker info | grep -i "Registry Mirrors" -A2 || true

      - name: Login to Alibaba Cloud ACR
        env:
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        if: ${{ env.ACR_REGISTRY != '' && env.ACR_USERNAME != '' && env.ACR_PASSWORD != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ env.ACR_USERNAME }}
          password: ${{ env.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push App Image with cache
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ vars.ACR_REGISTRY != '' }}
          tags: |
            ${{ env.APP_IMAGE_REPO }}:${{ github.sha }}
            ${{ env.APP_IMAGE_REPO }}:latest
          cache-from: type=registry,ref=${{ env.APP_IMAGE_REPO }}:buildcache
          cache-to: type=registry,ref=${{ env.APP_IMAGE_REPO }}:buildcache,mode=max

      - name: Resolve image source (prefer ACR mirror)
        shell: bash
        env:
          MYSQL_IMAGE_DEFAULT: ${{ vars.MYSQL_IMAGE || 'docker.m.daocloud.io/library/mysql:8.0' }}
          IPFS_IMAGE_DEFAULT: ${{ vars.IPFS_IMAGE || 'ghcr.io/ipfs/kubo:v0.30.0' }}
          MYSQL_IMAGE_MIRROR: ${{ vars.MYSQL_IMAGE_MIRROR || '' }}
          IPFS_IMAGE_MIRROR: ${{ vars.IPFS_IMAGE_MIRROR || '' }}
        run: |
          set -euo pipefail
          MYSQL_IMAGE_EFFECTIVE="${MYSQL_IMAGE_MIRROR:-${MYSQL_IMAGE_DEFAULT}}"
          IPFS_IMAGE_EFFECTIVE="${IPFS_IMAGE_MIRROR:-${IPFS_IMAGE_DEFAULT}}"
          echo "MYSQL_IMAGE_EFFECTIVE=${MYSQL_IMAGE_EFFECTIVE}" >> "$GITHUB_ENV"
          echo "IPFS_IMAGE_EFFECTIVE=${IPFS_IMAGE_EFFECTIVE}" >> "$GITHUB_ENV"
          echo "Resolved MYSQL_IMAGE value=${MYSQL_IMAGE_EFFECTIVE}"
          echo "Resolved IPFS_IMAGE value=${IPFS_IMAGE_EFFECTIVE}"

      - name: Write .env for compose
        shell: bash
        run: |
          set -euo pipefail
          cat > .env <<EOF
          APP_PORT=${{ vars.APP_PORT || '8081' }}
          MYSQL_HOST_PORT=${{ vars.MYSQL_HOST_PORT || '3307' }}
          MYSQL_DATABASE=${{ vars.MYSQL_DATABASE || 'family_tree' }}
          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD || '123456' }}
          MYSQL_APP_USER=${{ vars.MYSQL_APP_USER || 'root' }}
          MYSQL_APP_PASSWORD=${{ secrets.MYSQL_APP_PASSWORD || '123456' }}
          MYSQL_IMAGE=${{ env.MYSQL_IMAGE_EFFECTIVE }}
          IPFS_IMAGE=${{ env.IPFS_IMAGE_EFFECTIVE }}
          APP_IMAGE=${{ env.APP_IMAGE_REPO }}:${{ github.sha }}
          CONFLUX_RPC_URL=${{ vars.CONFLUX_RPC_URL || 'https://evmtestnet.confluxrpc.com' }}
          CONFLUX_PRIVATE_KEY=${{ secrets.CONFLUX_PRIVATE_KEY || '' }}
          CONFLUX_CONTRACT_ADDRESS=${{ secrets.CONFLUX_CONTRACT_ADDRESS || '' }}
          IPFS_MULTI_ADDRESS=${{ vars.IPFS_MULTI_ADDRESS || '/dns4/ipfs-node/tcp/5001' }}
          IPFS_API_PORT=${{ vars.IPFS_API_PORT || '5001' }}
          IPFS_GATEWAY_PORT=${{ vars.IPFS_GATEWAY_PORT || '8080' }}
          IPFS_SWARM_PORT=${{ vars.IPFS_SWARM_PORT || '4001' }}
          SPRING_PROFILES_ACTIVE=${{ vars.SPRING_PROFILES_ACTIVE || 'dev' }}
          EOF

      - name: Deploy with docker compose
        shell: bash
        run: |
          set -euo pipefail
          if docker compose version >/dev/null 2>&1; then
            COMPOSE_CMD="docker compose"
          else
            COMPOSE_CMD="docker-compose"
          fi
          echo "Using compose command: ${COMPOSE_CMD}"

          # Pull all required images, including the newly built app image
          $COMPOSE_CMD --env-file .env pull

          # Start services without building locally
          $COMPOSE_CMD --env-file .env up -d

          # Display running containers
          $COMPOSE_CMD --env-file .env ps
